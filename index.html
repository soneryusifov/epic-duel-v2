// Room shim: gives the game the same room API it uses on claude.ai, backed by this server's /ws.
(function(){
if(window.claude)return;
const proto=location.protocol==='https:'?'wss':'ws';let ws,me=null,open=false;const RS={};
function conn(){ws=new WebSocket(proto+'://'+location.host+'/ws');
 ws.onopen=()=>{open=true;Object.values(RS).forEach(r=>r._join());Object.values(RS).forEach(r=>r._conn(true))};
 ws.onclose=()=>{open=false;Object.values(RS).forEach(r=>r._conn(false));setTimeout(conn,1500)};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}if(m.t==='hi'){me=m.id;return}const r=RS[m.room];if(!r)return;if(m.t==='peers')r._peers(m.peers);else if(m.t==='msg')r._msg(m)}}
const tx=o=>{if(open)ws.send(JSON.stringify(o))};
function mk(name){const L={},P=[],C=[];let pr=[];
 const r={name,
  on(t,f){(L[t]=L[t]||[]).push(f);return()=>{L[t]=(L[t]||[]).filter(x=>x!==f)}},
  emit:async(t,d)=>{tx({t:'emit',room:name,topic:t,data:d})},
  presence:async p=>{tx({t:'pres',room:name,patch:p})},
  peers:()=>pr,
  onPeers(f){P.push(f);return()=>{const i=P.indexOf(f);if(i>=0)P.splice(i,1)}},
  connected:()=>open,
  onConnection(f){C.push(f);return()=>{const i=C.indexOf(f);if(i>=0)C.splice(i,1)}},
  leave:async()=>{tx({t:'leave',room:name});if(name!=='lobby')delete RS[name]},
  join:async n=>RS[n]||mk(n),
  _join(){tx({t:'join',room:name})},
  _conn(v){C.slice().forEach(f=>f(v))},
  _peers(l){const old=pr;pr=l.map(p=>({...p,isMe:p.peer===me,sameTab:p.peer===me,kind:'viewer',guest:false}));
   const joined=pr.filter(p=>!old.some(o=>o.peer===p.peer)),left=old.filter(o=>!pr.some(p=>p.peer===o.peer));
   P.slice().forEach(f=>f({peers:pr,joined,left,updated:[]}))},
  _msg(m){(L[m.topic]||[]).slice().forEach(f=>f({topic:m.topic,data:m.data,peer:m.peer,isMe:m.peer===me,sameTab:m.peer===me,kind:'viewer',guest:false}))}};
 RS[name]=r;if(open)r._join();return r}
const lobby=mk('lobby');
window.claude={use:async n=>n==='room'?lobby:null};
conn();
})();
</script>

function roll(a,raw,k,mc){let v=raw*R(.9,1.1);const o={};if(a.hp<a.mhp*.25)v*=R(1.2,1.5);if(Math.random()<.05){v*=R(2,2.65);o.crit=1}
 if(k=='melee'&&Math.random()<.05)o.blk=1;if(k=='ranged'&&Math.random()<mc){v*=R(.25,.5);o.miss=1}o.v=o.blk?0:v;return o}
function apply(a,d,v){v*=1-Math.min(.5,.02*d.al.df);const s=Math.min(d.sh,v);d.sh-=s;v-=s;const h=Math.min(d.hp,v);d.hp-=h;const dl=s+h;if(a.alive&&a.hp>0)a.hp=Math.min(a.mhp,a.hp+dl*.03*a.al.ls);if(d.hp<=0&&d.alive){d.alive=false;d.hp=0;d.dt=performance.now()}d.ht=performance.now()+250;return dl}
function hit(a,d,raw,k,mc){let o;if(M.rep)o=M.rep.shift()||{};else{o=roll(a,raw,k,mc);o.t=M.all.indexOf(d);if(!o.blk)o.dl=apply(a,d,o.v);if(M.log)M.log.push(o)}if(!o.blk)d.ht=performance.now()+250;if(o.blk){fl(d,'BLOCK','#9aa5b8');sfx('block');return o}const n=Math.round(o.dl||0);
 if(o.crit){fl(d,'CRIT! '+n,'#ffd24a',1);sfx('crit')}else if(o.miss){fl(d,'GLANCING '+n,'#ff9a3c');sfx('miss')}else{fl(d,''+n,'#fff');sfx('hit')}return o}
const foes=a=>M.all.filter(c=>c.team!=a.team&&c.alive);
function can(a,id){const m=a.mp;return id=='sword'||(id=='heavy'&&m>=16)||(id=='pistol'&&!a.cd.pistol)||(id=='bazooka'&&!a.cd.bazooka)||(id=='arc'&&m>=15)||(id=='plasma'&&m>=20)||(id=='nova'&&m>=30)||(id=='repair'&&a.jug&&m>=25&&a.hp<a.mhp)}
function est(a,id){const s=base(a,'sword'),n=M?foes(a).length:2;return id=='sword'?s:id=='heavy'?s*2.2:id=='pistol'?base(a,'pistol'):id=='bazooka'?base(a,'bazooka'):id=='nova'?s*(n==1?2.1:1.1):id=='repair'?a.mhp*.25:s*MULT[id]}
async function act(a,id,tg){M.busy=true;const E=foes(a),sw=base(a,'sword');a.mp-=COST[id]||0;
 if(id=='sword'||id=='heavy'){a.pose='sword';a.arm=-.9;await Promise.all([tw(a,'ox',tg.x-a.x-a.f*55*SC,260),tw(a,'oy',tg.y-a.y,260)]);sfx('sword');await tw(a,'arm',1.3,110);hit(a,tg,sw*(id=='heavy'?2.2:1),'melee');await sleep(180);await Promise.all([tw(a,'ox',0,240),tw(a,'oy',0,240)])}
 else if(id=='pistol'){a.cd.pistol=2;a.pose='pistol';a.arm=0;await sleep(150);await shot(a,tg,tc(a.wt.pistol));hit(a,tg,base(a,'pistol'),'ranged',.025);await sleep(250)}
 else if(id=='bazooka'){a.cd.bazooka=3;a.pose='baz';await sleep(400);await shot(a,tg,tc(a.wt.bazooka),1);const o=hit(a,tg,base(a,'bazooka'),'ranged',.05/3);
  const sec=E.find(e=>e!=tg);if(sec&&!o.blk){await sleep(80);burst(sec,'#ff9a3c');let n;if(M.rep)n=(M.rep.shift()||{}).dl||0;else{n=Math.round(apply(a,sec,o.v*.5));if(M.log)M.log.push({t:M.all.indexOf(sec),dl:n})}fl(sec,'SPLASH '+n,'#ff9a3c')}await sleep(300)}
 else if(id=='repair'){sfx('heal');const h=a.mhp*.25;a.hp=Math.min(a.mhp,a.hp+h);fl(a,'+'+Math.round(h),'#27d36b',1);burst(a,'#27d36b');await sleep(600)}
 else{const col={arc:'#06b6d4',plasma:'#d946ef',nova:'#f97316'}[id];a.arm=-1.6;sfx('skill');burst(a,col);await sleep(350);
  if(id=='nova'){const m=E.length==1?2.1:1.1;for(const e of E.slice()){burst(e,col);hit(a,e,sw*m,'spell')}}else{await shot(a,tg,col);hit(a,tg,sw*MULT[id],'spell')}await sleep(350)}
 a.pose=null;a.arm=.4;M.busy=false}
function ai(a){const E=foes(a),opts=ITEMS.map(i=>i.id).filter(i=>can(a,i)&&(i!='repair'||a.hp<a.mhp*.4));if(opts.includes('repair')&&a.hp<a.mhp*.35)return['repair',a];
 let id=opts.filter(i=>i!='repair').sort((x,y)=>est(a,y)/(1+(COST[y]||0)/60)-est(a,x)/(1+(COST[x]||0)/60))[0];if(Math.random()<.25)id=opts.filter(i=>i!='repair')[RI(0,opts.length-1-(opts.includes('repair')?1:0))]||id;
 const tg=Math.random()<.3?E[RI(0,E.length-1)]:E.slice().sort((x,y)=>x.hp-y.hp)[0];return[id,tg]}
// UI
const msg=t=>$('#msg').textContent=t||'';
function renderBar(){const a=M&&M.all.find(c=>c.human);const bar=$('#bar');if(!M){bar.className='off';bar.innerHTML='';return}
 bar.className=M.hturn&&!M.busy?'':'off';bar.innerHTML=ITEMS.filter(i=>i.id!='repair'||a.jug).map(i=>{const ok=can(a,i.id),cd=i.id=='pistol'?a.cd.pistol:i.id=='bazooka'?a.cd.bazooka:0;
  return`<button data-a="sk:${i.id}" style="background:${i.bg}" ${ok?'':'disabled'} class="${M.sel==i.id?'sel':''}"><svg viewBox="0 0 24 24"><path d="${i.ic}"/></svg>${i.n}<br>${cd?'CD '+cd:(COST[i.id]?COST[i.id]+'mp ':'')+'~'+Math.round(est(a,i.id))}</button>`}).join('')}
function pick(id){if(!M||!M.hturn||M.busy)return;const a=M.cur;if(!can(a,id))return;sfx('ui');const E=foes(a);
 if(id=='nova'||id=='repair'||E.length==1)return submit(id,id=='repair'?a:E[0]);M.sel=M.sel==id?null:id;msg(M.sel?'SELECT TARGET':'YOUR TURN');renderBar()}
function submit(id,tg){if(!M.hturn)return;M.hturn=false;M.sel=null;renderBar();if(M.online&&M.role=='guest'){RM.emit('act',{id,tg:M.all.indexOf(tg)});return}M.res({id,tg})}
cv.addEventListener('pointerdown',e=>{if(!M||!M.sel||!M.hturn)return;const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
 const t=foes(M.cur).find(c=>Math.abs(px-c.x)<45*SC&&py>c.y-150*SC&&py<c.y+14*SC);if(t)submit(M.sel,t);else msg('TAP AN ENEMY')});
function modal(h){$('#ov').hidden=false;$('#ov').innerHTML=`<div class="box">${h}<p class="ctr"><button data-a="close">Close</button></p></div>`}
const close=()=>{$('#ov').hidden=true;MF=null;if(RM&&!M){RM.leave();RM=null;if(LRM)LRM.presence({host:null})}},hud=()=>{$('#gold').textContent='💰 '+S.gold;$('#prof').textContent='Lv '+lvl()+' Cadet';$('#mu').style.opacity=S.mute?.4:1};let MF=null;
const AL=[['dmg','Base Damage','+4% weapon & skill damage'],['hp','Health','+6 max HP'],['sh','Shield','+5 absorb: taken after Defense, before HP'],['ls','Lifesteal','3% of damage dealt healed (never revives)'],['mp','Max Mana','+4 max mana'],['df','Defense','-2% incoming damage (cap 50%)']];
function openAlloc(){MF=openAlloc;modal(`<h2>Skill Points</h2><p>Remaining: <b>${30-used()}</b> / 30</p>${AL.map(([k,n,d])=>`<div class="row"><span class="l">${n}<small>${d}</small></span><button data-a="pt:${k}:-1">−</button><b>${S.al[k]}</b><button data-a="pt:${k}:1">+</button></div>`).join('')}<p><button data-a="rst">Reset</button></p><small>Hit order: base → ±10% → Rage ×1.2–1.5 (HP&lt;25%) → Crit ×2–2.65 (5%) → ranged miss ×0.25–0.5 (pistol 2.5%, bazooka 1.7%) / sword block 5% → Defense → Shield → HP → Lifesteal. Skills use sword base damage × multiplier. Mana +4 per turn.</small>`)}
function openShop(t='sword'){MF=()=>openShop(t);const ow=S.own[t];modal(`<h2>Merchant · 💰 ${S.gold}</h2><div class="tabs">${['sword','pistol','bazooka'].map(x=>`<button data-a="tab:${x}" ${x==t?'disabled':''}>${x}</button>`).join('')}</div>
 <div class="row"><span class="l">Standard issue<small>+0%</small></span><button data-a="eq:${t}:-1" ${S.eq[t]==-1?'disabled':''}>${S.eq[t]==-1?'Equipped':'Equip'}</button></div>`+
 NM[t].map((n,i)=>{const has=ow.includes(i);return`<div class="row"><span class="l" style="color:${tc(i)}">T${i+1} ${n}<small>+${Math.round(bonus(i)*100)}% · ${price(t,i)} gold</small></span>${has?`<button data-a="eq:${t}:${i}" ${S.eq[t]==i?'disabled':''}>${S.eq[t]==i?'Equipped':'Equip'}</button>`:`<button data-a="buy:${t}:${i}" ${S.gold<price(t,i)?'disabled':''}>Buy</button>`}</div>`}).join(''))}
function openProf(){MF=openProf;modal(`<h2>Cadet · Level ${lvl()}</h2><p>Wins ${S.w} · Losses ${S.l} · Gold ${S.gold}</p><p>${AL.map(([k,n])=>n+': '+S.al[k]).join('<br>')}</p><p>Sword: ${S.eq.sword<0?'Standard':NM.sword[S.eq.sword]}<br>Pistol: ${S.eq.pistol<0?'Standard':NM.pistol[S.eq.pistol]}<br>Bazooka: ${S.eq.bazooka<0?'Standard':NM.bazooka[S.eq.bazooka]}</p>`)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const [a,x,y]=b.dataset.a.split(':');sfx('ui');
 if(a=='sk')return pick(x);if(a=='close')return close();if(a=='prof')return openProf();if(M&&!M.over&&['alloc','shop','mode','onl','ocr','ojn'].includes(a))return;
 if(a=='mute'){S.mute=S.mute?0:1}else if(a=='lay'){S.lay={auto:'land',land:'port',port:'auto'}[S.lay];msg('Layout: '+S.lay);setTimeout(()=>msg(M&&M.hturn?'YOUR TURN':''),1200);rs()}
 else if(a=='alloc')return openAlloc();else if(a=='shop')return openShop();else if(a=='mode')return start(x);else if(a=='onl')return openOnl();else if(a=='ocr')return onl(gen(),'host');else if(a=='ojn'){const c=(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(c.length<4)return;$('#inv').hidden=true;return onl(c,'guest')}
 else if(a=='pt'){const d=+y;if(d>0&&used()>=30)return;if(d<0&&S.al[x]<=0)return;S.al[x]+=d;LB[0]=lobbyMe()}else if(a=='rst')S.al={dmg:0,hp:0,sh:0,ls:0,mp:0,df:0};
 else if(a=='tab')return openShop(x);else if(a=='buy'){const p=price(x,+y);if(S.gold>=p&&!S.own[x].includes(+y)){S.gold-=p;S.own[x].push(+y);S.eq[x]=+y;LB[0]=lobbyMe()}}
 else if(a=='eq'){S.eq[x]=+y;LB[0]=lobbyMe()}else if(a=='ret'){M=null;close();place();$('#menu').hidden=false;msg('');renderBar();return}
 save();hud();if(!M)place();if(MF)MF()});
const lobbyMe=()=>{const c=me();c.name='You';return c};
// match flow
let mm=false;
async function start(mode){if(M||mm)return;mm=true;$('#menu').hidden=true;$('#ov').hidden=false;$('#ov').innerHTML='<div class="box ctr"><h2>Matchmaking</h2><div class="spin"></div><p>Scanning the grid for opponents…</p></div>';
 await sleep(RI(3000,6000));close();const p=me();let mates=[],fs=[];const used2=NAMES.slice().sort(()=>Math.random()-.5),n={'1v1':1,'2v2':2,'3v3':3}[mode]||0;
 if(mode=='jug'){p.jug=true;p.name='Juggernaut';const a=RI(20,25);fs=[npc(1,a,used2[0]),npc(1,45-a,used2[1])]}else{for(let i=0;i<n-1;i++)mates.push(npc(0,30,used2[i]));for(let i=0;i<n;i++)fs.push(npc(1,30,used2[5+i]))}
 const t0=[p,...mates],q=[];if(mode=='jug')q.push(p,...fs);else for(let i=0;i<n;i++)q.push(t0[i],fs[i]);
 M={mode,my:0,all:[...t0,...fs],q,i:0,sel:null,hturn:false,busy:false,over:false,paid:false};mm=false;place();run()}
const endChk=()=>!M.all.some(c=>c.team==1&&c.alive)?'w':!M.all.some(c=>c.team==0&&c.alive)?'l':0;
async function run(){for(;;){const a=M.q[M.i++%M.q.length];if(!a.alive)continue;a.cd.pistol=Math.max(0,a.cd.pistol-1);a.cd.bazooka=Math.max(0,a.cd.bazooka-1);a.mp=Math.min(a.mmp,a.mp+4);M.cur=a;let id,tg;if(M.online){M.n++;M.turn={i:M.all.indexOf(a),s:snap(),n:M.n};RM.emit('turn',M.turn)}
  if(a.human){M.hturn=true;msg('YOUR TURN');renderBar();const r=await new Promise(res=>M.res=res);if(r.dc)return;id=r.id;tg=r.tg;msg('')}else if(a.remote){M.hturn=false;msg(`OPPONENT'S TURN`);renderBar();const r=await new Promise(res=>M.res=res);if(r.dc)return;id=r.id;tg=r.tg}else{M.hturn=false;msg(a.name.toUpperCase()+"'S TURN");renderBar();await sleep(800);[id,tg]=ai(a)}
  if(!tg||!tg.alive&&id!='repair'){tg=foes(a)[0]}if(M.dc)return;if(M.online)M.log=[];await act(a,id,tg);if(M.dc)return;renderBar();const r=endChk();if(M.online){M.n++;RM.emit('play',{a:M.all.indexOf(a),id,tg:M.all.indexOf(tg),log:M.log,s:snap(),r,n:M.n});M.log=null}if(r){finish(r=='w');return}}}
async function finish(win){M.over=true;M.cur=null;M.all.forEach(c=>{if(c.alive&&(c.team==M.my)==win)c.win=true});sfx(win?'win':'lose');renderBar();await sleep(1200);
 if(!M.paid){M.paid=true;const [lo,hi]=REW[M.mode];const g=win?RI(lo,hi):Math.round(lo*.4);S.gold+=g;win?S.w++:S.l++;save();hud();modal(`<h2 class="ctr">${win?'VICTORY':'DEFEAT'}</h2><p class="ctr">Reward: <b style="color:#ffd24a">+${g} gold</b></p><p class="ctr"><button data-a="ret">Return to Lobby</button></p>`);$('#ov .box>p:last-child').remove()}}
let RM=null,QQ=Promise.resolve();const q=f=>{QQ=QQ.then(f).catch(()=>{})};
const st=t=>{const e=$('#ost');if(e)e.textContent=t;else msg(t)},gen=()=>Array.from({length:4},()=>'abcdefghjkmnpqrstuvwxyz23456789'[RI(0,30)]).join('');
const SP=()=>({al:{...S.al},wt:{...S.eq}}),snap=()=>M.all.map(c=>[c.hp,c.sh,c.mp,c.cd.pistol,c.cd.bazooka,c.alive?1:0]);
const unsnap=s=>(Array.isArray(s)?s:[]).forEach((v,i)=>{const c=M.all[i];if(!c||!Array.isArray(v))return;c.hp=+v[0]||0;c.sh=+v[1]||0;c.mp=+v[2]||0;c.cd.pistol=v[3]|0;c.cd.bazooka=v[4]|0;if(c.alive&&!v[5]){c.alive=false;c.dt=performance.now()}});
const okSpec=s=>{try{return AL.every(([k])=>Number.isInteger(s.al[k])&&s.al[k]>=0)&&AL.reduce((t,[k])=>t+s.al[k],0)<=30&&['sword','pistol','bazooka'].every(k=>Number.isInteger(s.wt[k])&&s.wt[k]>=-1&&s.wt[k]<=9)}catch(e){return false}};
const fromSpec=(s,team,nm)=>mkc(nm,team,{...s.al},{sword:bon(s.wt.sword),pistol:bon(s.wt.pistol),bazooka:bon(s.wt.bazooka)},{...s.wt},team?'#8a2a7a':'#1aa7c9');
function openOnl(pre=''){MF=null;modal(`<h2>Online 1v1</h2><p>Press Create room, then send your friend this page's link. When they open it, a Join button appears on their screen.</p><p class='ctr'><button data-a='ocr'>Create room</button></p><p id='ost' class='ctr'></p>`)}
function dc(){if(!M||M.over)return;M.over=true;M.dc=1;if(M.res)M.res({dc:1});M.hturn=false;renderBar();msg('');modal(`<h2>Opponent disconnected</h2><p>The match ended with no reward.</p><p class='ctr'><button data-a='ret'>Return to Lobby</button></p>`);$('#ov .box>p:last-child').remove()}
function startOnline(role,s,peer){if(LRM)LRM.presence({host:null});$('#ov').hidden=true;MF=null;$('#menu').hidden=true;const h=role=='host',a=fromSpec(s[0],0,h?'You':'Host'),b=fromSpec(s[1],1,h?'Rival':'You');(h?a:b).human=true;b.remote=h;M={mode:'1v1',my:h?0:1,all:[a,b],q:[a,b],i:0,sel:null,hturn:false,busy:false,over:false,paid:false,online:1,role,peer,n:0,last:-1,log:null,rep:null};place();renderBar();msg(h?'':'WAITING FOR HOST…');if(h)run()}
async function onl(code,role){const rm=window.claude?await claude.use('room').catch(()=>null):null;
 if(!rm)return st('Could not reach the game server. Reload the page and try again.');
 st('Connecting…');LRM=rm;let RR;try{RR=await rm.join('ed-'+code)}catch(e){return st('Could not join room ('+(e.code||'error')+').')}RM=RR;const h=role=='host';
 RR.onPeers(c=>{if(M&&M.online&&!M.over&&c.left.length)dc()});
 if(h){LRM.presence({host:code});st('Room ready — send your friend the artifact link. Waiting for them…');
  RR.on('hello',m=>{if(M||m.isMe||!okSpec(m.data))return;const s=[SP(),m.data];startOnline('host',s,m.peer);const iv=setInterval(()=>{if(!M||M.over||M.ready||!RM)return clearInterval(iv);RR.emit('start',{s})},1000);RR.emit('start',{s})});
  RR.on('ready',m=>{if(M&&m.peer==M.peer)M.ready=1});
  RR.on('act',m=>{if(!M||M.over||!M.online||m.peer!=M.peer)return;const a=M.cur,d=m.data||{};if(!a||!a.remote||!M.res||M.busy)return;const id=d.id;let tg=M.all[d.tg];
   const ok=ITEMS.some(i=>i.id==id)&&can(a,id)&&(id=='repair'?(tg=a,1):id=='nova'?(tg=foes(a)[0],1):tg&&tg.alive&&tg.team!=a.team);
   if(!ok){RM.emit('turn',M.turn);return}const r=M.res;M.res=null;r({id,tg})})
 }else{st('Joining room…');const iv=setInterval(()=>{if(M||!RM)return clearInterval(iv);RR.emit('hello',SP())},1000);RR.emit('hello',SP());
  RR.on('start',m=>{if(M||m.isMe||!m.data||!Array.isArray(m.data.s)||m.data.s.length!=2||!m.data.s.every(okSpec))return;startOnline('guest',m.data.s,m.peer);RR.emit('ready',{})});
  RR.on('turn',m=>{if(!M||!M.online||m.peer!=M.peer||m.isMe)return;const d=m.data||{};if(!(d.n>=M.last))return;q(()=>{if(M.over)return;M.last=d.n;unsnap(d.s);const a=M.all[d.i];if(!a)return;M.cur=a;M.hturn=!!a.human&&!M.busy;msg(a.human?'YOUR TURN':`OPPONENT'S TURN`);renderBar()})});
  RR.on('play',m=>{if(!M||!M.online||m.peer!=M.peer||m.isMe)return;const d=m.data||{};if(!(d.n>M.last))return;q(async()=>{if(M.over)return;M.last=d.n;const a=M.all[d.a],tg=M.all[d.tg];if(!a||!tg||!Array.isArray(d.log))return;M.hturn=false;M.rep=d.log.slice();await act(a,d.id,tg);M.rep=null;unsnap(d.s);renderBar();if(d.r)finish(d.r=='l')})})}
}
let LRM=null;function invite(c){const e=$('#inv');if(M||RM){e.hidden=true;return}const p=(c.peers||[]).find(p=>!p.isMe&&p.presence&&/^[a-z0-9]{4}$/.test(p.presence.host||''));if(!p){e.hidden=true;return}e.hidden=false;e.innerHTML=`<button data-a='ojn:${p.presence.host}'>⚔ Join friend's duel</button>`}
;(async()=>{const rm=window.claude?await claude.use('room').catch(()=>null):null;if(!rm)return;LRM=rm;rm.onPeers(invite)})();
LB=[lobbyMe(),npc(0,10,'Quartermaster'),npc(1,10,'Archivist'),npc(1,10,'Sentinel')];LB.forEach((c,i)=>{if(i){c.arm=-.3}});
rs();hud();frame();
