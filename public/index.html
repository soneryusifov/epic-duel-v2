  peers:()=>pr,
  onPeers(f){P.push(f);return()=>{const i=P.indexOf(f);if(i>=0)P.splice(i,1)}},
  connected:()=>open,
  onConnection(f){C.push(f);return()=>{const i=C.indexOf(f);if(i>=0)C.splice(i,1)}},

 RS[name]=r;if(open)r._join();return r}

conn();
})();

HB.muEN=()=>`<p>All 15 classes sit on ONE ring. Each class has a <b>Nemesis Advantage</b> over the next class on the ring (+30% damage dealt and 30% less damage taken from that class) and a <b>Tactical Advantage</b> over the class after it (+15% / −15%). In the opposite direction it is weak by the same amounts. Against the other 10 classes everything is neutral, and no class is ever strong against itself. Every class has exactly two strengths and two weaknesses.</p>${ringList(0)}<p>During your turn a small ▲/▼ mark above each enemy shows the matchup. It applies once per hit to every attack, skill and splash (not to poison or true damage). Open <b>Choose your hero</b> to see the ring.</p>`;
HB.muTR=()=>`<p>15 sınıfın hepsi TEK bir çemberde durur. Her sınıfın çemberdeki sonraki sınıfa karşı <b>Nemesis Üstünlüğü</b> (o sınıfa %30 fazla hasar verir, ondan %30 az hasar alır), ondan sonrakine karşı <b>Taktiksel Üstünlüğü</b> (%15 / %15) vardır. Ters yönde aynı oranlarda zayıftır. Diğer 10 sınıfa karşı her şey nötrdür; hiçbir sınıf kendisine karşı üstün değildir. Her sınıfın tam iki güçlü, iki zayıf olduğu sınıf vardır.</p>${ringList(1)}<p>Sıra sendeyken her düşmanın üstünde eşleşmeyi gösteren küçük bir ▲/▼ işareti çıkar. Her vuruşta bir kez uygulanır; her saldırıya, skille ve sıçramaya geçerlidir (zehre ve gerçek hasara değil). Çemberi görmek için <b>Kahramanını seç</b> ekranını aç.</p>`;

HB.synEN=()=>`<p>Each class has one <b>synergy</b> between its main weapon and the common Pistol / Bazooka. The main weapon (or a class skill) builds a resource, and the Pistol or Bazooka spends it for extra power. Rules that apply to all of them: a resource has a hard cap, a single action never both builds and spends, spending happens once per shot, running effects expire after a few turns, and Pistol / Bazooka keep their own cooldowns and ammo (Pistol 5 shots, Bazooka 3). Buttons marked ✦ have a synergy ready.</p><ul>${Object.keys(SYN).map(k=>`<li style="color:${CLS[k].col}"><b>${CLS[k].n} — ${SYN[k].n}</b> <small>(${SYN[k].w})</small><br><span style="color:#cfe0ff">${SYN[k].tx[0]}</span></li>`).join('')}</ul>`;
HB.synTR=()=>`<p>Her sınıfın ana silahı ile ortak Tabanca / Bazuka arasında bir <b>sinerjisi</b> vardır. Ana silah (veya bir sınıf becerisi) kaynak biriktirir, Tabanca ya da Bazuka bunu harcayıp ekstra güç kazanır. Hepsinde geçerli kurallar: kaynağın sert bir üst sınırı vardır, tek bir eylem hem biriktirip hem harcayamaz, harcama atış başına bir kez olur, süreli etkiler birkaç turda biter, Tabanca / Bazuka kendi bekleme süresini ve mermisini korur (Tabanca 5, Bazuka 3). ✦ işaretli butonlarda sinerji hazırdır.</p><ul>${Object.keys(SYN).map(k=>`<li style="color:${CLS[k].col}"><b>${cnT(k)} — ${TRD[SYN[k].n]||SYN[k].n}</b> <small>(${SYN[k].w})</small><br><span style="color:#cfe0ff">${SYN[k].tx[1]}</span></li>`).join('')}</ul>`;
HB.upEN=()=>`<p>The Merchant sells weapon upgrades for your main weapon, Pistol and Bazooka. Each has three tracks with 5 levels: <b>Power</b> (+3% damage per level), <b>Specialty</b> (class dependent: crit, lifesteal, guard, healing or synergy cap; Pistol: fewer glancing hits; Bazooka: +1 shot at levels 3 and 5) and <b>Piercing</b> (ignore 5% of the target's Defense per level). They are saved with your account, work in every class and online, and are never counted twice.</p>`;
HB.upTR=()=>`<p>Tüccar ana silahın, Tabancan ve Bazukan için yükseltme satar. Her birinin 5 seviyeli üç kolu vardır: <b>Güç</b> (seviye başına +%3 hasar), <b>Uzmanlık</b> (sınıfa göre: kritik, can çalma, koruma, iyileştirme veya sinerji sınırı; Tabanca: daha az sıyırma; Bazuka: 3. ve 5. seviyede +1 atış) ve <b>Delme</b> (seviye başına hedefin Defansının %5'ini yok sayar). Hesabınla birlikte kaydedilir, her sınıfta ve çevrim içi çalışır, hiçbir zaman iki kez sayılmaz.</p>`;

modal(`<h2>How to Play</h2>`+
sec('Turns and controls',`<ul><li>Turns alternate between the two sides, one fighter at a time. The name marked with ▼ is acting. In 1v1 you and the enemy simply take turns.</li><li>On your turn pick an action, then tap an enemy. If only one enemy is alive the attack goes to it automatically. Nova Strike and Repair need no target.</li><li>When it is not your turn the action buttons fade out and cannot be pressed. A greyed button means not enough mana or the weapon is on cooldown.</li><li>The number on each button is the average damage (or healing) with your current stats. Under it you see the mana cost, or CD with the turns left on cooldown.</li><li>Top bar: your name opens your profile, ⇄ switches layout (auto / landscape / portrait), ♪ mutes sound, ⚙ opens Settings (show blood on/off, sound on/off), ? opens this guide.</li><li>Tap any fighter to open an info card. It lists their stats and an <b>Equipment</b> table: which weapon and which gear piece sits in each slot (an empty slot shows —).</li></ul>`,1)+
sec('Actions',`<ul><li><b>Sword</b>: free melee hit, base ${WM.sword} damage.</li><li><b>Heavy Sword</b>: ${COST.heavy} mana, melee, 2.2× the sword's damage.</li><li><b>Pistol</b>: free, base ${WM.pistol} damage (1.5× the sword's base). Usable every 2nd turn of yours; the first use is ready immediately. Only <b>5 shots</b> per match. The pistol rests in the hip holster; to fire it the fighter drops the main weapon and picks it up again afterwards.</li><li><b>Bazooka</b>: free, base ${WM.bazooka} damage (2× the sword's base), usable every 3rd turn (first use ready immediately). Only <b>3 shots</b> per match. It is carried on the back. Also splashes nearby enemies.</li><li><b>Pistol and Bazooka modes</b> (Mage only): the Mage can switch each of them between Physical and Magic damage with the buttons under its skills. Everyone else always shoots Physical.</li><li><b>Arc Bolt</b>: ${COST.arc} mana, ${pc(MULT.arc)}% of sword damage.</li><li><b>Plasma Burst</b>: ${COST.plasma} mana, ${pc(MULT.plasma)}% of sword damage.</li><li><b>Nova Strike</b>: ${COST.nova} mana. Two enemies alive: 110% to each. One enemy alive: 210% to it.</li><li><b>Lightning Storm</b> (Mage only): 60 mana, usable on your 2nd turn and then every 2nd turn. 3.3× your sword damage as magic damage. The Mage raises the staff, waits, slams it into the ground and lightning strikes each enemy, with the same splash rule as the bazooka (50% / 25% by position).</li><li><b>Elf skills</b> (Elf only, everything shot from a distance): Bow Shot (free, 1×), Power Shot (20 mana, ${EP}×), Triple Shot (30 mana, three arrows pulled one after another from the quiver, ${ET}× in total), Arrow Rain (60 mana, a volley shot into the sky that falls on every enemy 3 seconds later, ${ER}× to each enemy). About ${pc(EV)}% of attacks aimed at the Elf are dodged.</li><li><b>Venom Strike</b> (Vampire only): ${VC} mana, ${VN}× the dagger's damage, and the enemy is poisoned: it loses about ${PD} HP (±15%) at the start of each of its own turns for ${PT} turns. Poison is true damage (Defense and shields do not stop it).</li><li><b>Regeneration</b> (Mage passive): heals about ${pc(RG)}% of max health (±15%) every time the turn comes back to the Mage.</li><li><b>Void Strike</b>: ${COST.void} mana, ${pc(MULT.void)}% of sword damage as true damage.</li><li><b>Repair</b> (Juggernaut only): ${COST.repair} mana, heals 25% of max health. Needs missing health.</li><li><b>Warrior skills</b> (Warrior only, free, always ready, no area damage): Power Slash ${pc(WS[0])}%, Cross Cut (2 blows) ${pc(WS[1])}%, Blade Fury (4 blows) ${pc(WS[2])}% of sword damage.</li><li><b>Cooldowns</b>: every class skill has a cooldown of 1 or 2 turns after use (shown as CD on its button). The pistol waits 1 turn, the bazooka 2. The basic weapon hit has no cooldown.</li><li>Damage colours: orange numbers are physical damage, violet are magic, teal are true damage, and red are critical hits.</li><li>Skills (Arc, Plasma, Nova, Heavy Sword) are based on your sword's damage, so a better sword makes them stronger.</li></ul>`)+
sec('How a hit is calculated',`<ol><li><b>Base</b> = weapon base (the same for every class: Sword ${WM.sword}, Pistol ${WM.pistol}, Bazooka ${WM.bazooka}) × (1 + weapon tier bonus) × (1 + equipment bonus) × (1 + Damage Boost), then × the skill multiplier. Every bonus multiplies the total built so far.</li><li><b>Variation</b>: random ±10%.</li><li><b>Rage</b>: if the attacker is below 25% health, or on every 4th turn of that fighter, ×1.2 to ×1.5.</li><li><b>Critical</b>: 5% chance, ×2.0 to ×2.65.</li><li><b>Glancing hit</b> (ranged only): pistol 2.5% chance, bazooka about 1.7%. It still deals 25–50% of the damage and shows GLANCING.</li><li><b>Block</b> (sword and Heavy Sword only): 5% chance, the whole hit is stopped. Skills cannot be blocked or glance, but they can crit.</li><li><b>Defense</b> of the target: Physical Defense gives −2% physical damage per point and Magic Defense gives −2% magic damage per point, each capped at −50%.</li><li><b>Class armor</b>: a Tank takes 25% less physical and magic damage.</li><li><b>Shield</b> (from the Tank's Team Shield) absorbs physical and magic damage after Defense, then health drops. True damage skips Defense, class armor and shields.</li><li><b>Lifesteal</b>: the attacker heals its lifesteal share of the damage dealt, up to max health. A dead fighter is never revived.</li></ol>`)+
sec('Bazooka splash and criticals',`<ul><li>The bazooka's explosion hurts the enemies standing next to the target, based on their position in the enemy line (top, middle, bottom).</li><li>Target in the middle: the enemy above and the enemy below each take 50% of the main damage.</li><li>Target at the top or bottom: the enemy next to it takes 50% and the one farthest away takes 25%.</li><li>With only two enemies, the other one takes 50%. Fallen enemies take no splash, but they still count for distance.</li><li>Splash uses the main target's resolved damage (after variation, Rage, crit and glancing) and then each victim's own defense. Splash and Repair healing also vary by \u00B110% like every other hit.</li><li>The main hit has its own 5% crit chance, and each splash victim has a separate 5% crit chance.</li><li>If the main hit is a crit, every splash inherits that increase and does not roll again. Otherwise each splash can crit on its own (\u00D72.0 to \u00D72.65).</li></ul>`)+

sec('Skill points and stats',`<p>You start with 30 skill points. Every level gives +1 point, and every 10th level gives +3 instead (level 10 = 41 points, level 100 = 149). You can reset and re-spend them any time in the lobby. Computer opponents get as many points as you have.</p><ul>${AL.map(([k,n,d])=>`<li><b>${n}</b>: ${d}</li>`).join('')}<li>Base health: Vampire 450, Warrior 630, Mage 510, Support 735, Tank 825 (plus equipment bonuses). Base mana is 100 (Mage and Support: 140 max); the Warrior has no mana at all and every Warrior skill is always ready. You start each fight with 100 mana and regain about 10 mana (±10%) at the start of each of your turns, up to your max.</li></ul>`)+
sec('Game modes and rewards',`<ul><li><b>1v1, 2v2, 3v3</b>: you plus computer teammates against the same number of computer opponents.</li><li><b>Juggernaut</b>: you alone, with your own points and the Repair skill, against two opponents who share a combined 45 skill points (50% more than the 30 of a full build).</li><li>A side wins when every fighter on the other side is down.</li><li>Level = 1 + wins ÷ 2.</li></ul><p>Gold per finished match, paid once:</p><ul>${rew}</ul><p>You start with 500 gold.</p>`)+
sec('Merchant and weapons',`<p>There are 10 tiers each of swords, pistols and bazookas. A purchased weapon is equipped automatically and changes how your fighter looks. You can switch equipped weapons for free.</p><p><b>Swords</b></p><ul>${tiers('sword')}</ul><p><b>Pistols</b></p><ul>${tiers('pistol')}</ul><p><b>Bazookas</b></p><ul>${tiers('bazooka')}</ul>`)+
sec('Online and saving',`<ul><li><b>Online 1v1</b>: press Create room, choose the mode (1v1, 2v2, 3v3) and whether your friend is your enemy or your teammate, then send the link. When they open it, you both pick your class and skill points, then fight. Remaining fighters are computer-controlled.</li><li><b>Lobby</b>: other online players appear in the lobby. Tap one, choose the mode and side, and send the invitation.</li><li><b>XP and levels</b>: every finished match gives XP, about 100 for a win and 25 for a defeat (each varies by ±10%). There is no daily limit. Early levels come quickly and later ones take more and more matches, up to level 100. Fleeing gives no XP.</li><li>The room creator's browser decides every roll and result and sends them to the other player, so both see the same fight. This is not a fully secure server.</li><li>If someone disconnects the match ends with no reward.</li><li><b>Log in or register</b> to keep your progress on any device. As a guest, progress is saved only in this browser.</li><li>Gold is counted by your browser, so it is not protected against cheating yet.</li></ul>`));}

const TRC=new Map();
function tr1(c){
 if(TRD[c]!==undefined)return TRD[c];
 for(const [re,f] of TRP){const m=re.exec(c);if(m)return f(...m)}
 let m=/^(.*?)((?: [★ⓘ])+)$/.exec(c);if(m){const a=tr1(m[1]);if(a!==m[1])return a+m[2]}
 if(c.includes(' · ')){return c.split(' · ').map(tr1).join(' · ')}
 const k=c.indexOf(': ');if(k>0){const a=tr1(c.slice(0,k)),b=tr1(c.slice(k+2));if(a!==c.slice(0,k)||b!==c.slice(k+2))return a+': '+b}
 return c}
function LT(s){if(LANG!='tr'||typeof s!='string'||!s)return s;const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(s);if(!m[2])return s;let r=TRC.get(m[2]);if(r===undefined){r=tr1(m[2]);if(TRC.size>3000)TRC.clear();TRC.set(m[2],r)}return m[1]+r+m[3]}

sec('Sıra ve kontroller',`<ul><li>Sıra iki taraf arasında dönüşümlü ilerler, her seferinde bir savaşçı oynar. ▼ ile işaretli isim sırası gelen savaşçıdır. 1v1'de sen ve rakip sırayla oynarsınız.</li><li>Sıran gelince bir aksiyon seç, sonra bir düşmana dokun. Tek düşman hayattaysa saldırı otomatik ona gider. Nova Darbesi ve Onarım hedef istemez.</li><li>Sıran değilken aksiyon butonları sönükleşir ve basılamaz. Gri buton, yetersiz mana ya da bekleme süresi demektir.</li><li>Her butondaki sayı, mevcut değerlerinle ortalama hasardır (ya da iyileşme). Altında mana bedeli ya da BK ile kalan bekleme turu görünür.</li><li>Üst çubuk: adın profilini açar, ⇄ görünümü değiştirir (otomatik / yatay / dikey), ♪ sesi kapatır, ⚙ Ayarları açar (kan göstermeyi ve sesi aç/kapa), ? bu rehberi açar, TR/EN dili değiştirir, ⚑ Kaç savaştan çıkar.</li><li>Bir savaşçının üstüne basınca (ya da fareyle üstüne gelince) tüm build'i görürsün; kartta bir <b>Ekipman</b> tablosu da vardır: hangi yuvada hangi silah ve ekipman parçası var (boş yuva — olarak görünür).</li></ul>`,1)+
sec('Aksiyonlar',`<ul><li><b>Kılıç</b>: bedava yakın dövüş vuruşu, temel hasar ${WM.sword}.</li><li><b>Ağır Kılıç</b>: ${COST.heavy} mana, yakın dövüş, kılıç hasarının 2,2 katı.</li><li><b>Tabanca</b>: bedava, temel hasar ${WM.pistol} (kılıç temelinin 1,5 katı). Senin her 2. turunda kullanılır; ilk kullanım hemen hazırdır. Maç başına sadece <b>5 mermi</b>. Tabanca kalçadaki kılıftadır; ateşlemek için savaşçı asıl silahını yere bırakır ve sonra tekrar alır.</li><li><b>Bazuka</b>: bedava, temel hasar ${WM.bazooka} (kılıç temelinin 2 katı), her 3. turda kullanılır (ilk kullanım hemen hazır). Maç başına sadece <b>3 mermi</b>. Sırtta taşınır. Yakındaki düşmanlara da sıçrama hasarı verir.</li><li><b>Tabanca ve Bazuka modları</b> (sadece Büyücü): Büyücü, skillerinin altındaki düğmelerle her birini Fiziksel ve Büyü hasarı arasında değiştirebilir. Diğer herkes her zaman Fiziksel ateş eder.</li><li><b>Ark Şimşeği</b>: ${COST.arc} mana, kılıç hasarının %${pc(MULT.arc)}'i.</li><li><b>Plazma Patlaması</b>: ${COST.plasma} mana, kılıç hasarının %${pc(MULT.plasma)}'i.</li><li><b>Nova Darbesi</b>: ${COST.nova} mana. İki düşman hayattaysa her birine %110. Tek düşman kaldıysa ona %210.</li><li><b>Şimşek Fırtınası</b> (sadece Büyücü): 60 mana, 2. turunda ve sonra her 2. turda kullanılır. Kılıç hasarının 3,3 katı büyü hasarı; Büyücü asayı kaldırır, bekler, yere vurur ve şimşekler her düşmanın üstüne düşer. Sıçrama kuralı bazukayla aynıdır (konuma göre %50 / %25).</li><li><b>Elf skilleri</b> (sadece Elf, hepsi uzaktan): Ok Atışı (bedava, 1×), Güçlü Ok (20 mana, ${String(EP).replace('.',',')}×), Üçlü Atış (30 mana, sadece sırttaki okluktan art arda çekilen üç ok, toplam ${String(ET).replace('.',',')}×), Ok Yağmuru (60 mana, gökyüzüne atılan ve 3 saniye sonra her düşmanın üstüne düşen salvo, her düşmana ${String(ER).replace('.',',')}×). Elf'e yönelen saldırıların yaklaşık %${pc(EV)}'i savuşturulur.</li><li><b>Zehirli Vuruş</b> (sadece Vampir): ${VC} mana, orak hasarının ${String(VN).replace('.',',')} katı; ayrıca düşman zehirlenir: ${PT} tur boyunca kendi sırasının başında yaklaşık ${PD} can (±%15) kaybeder. Zehir gerçek hasardır (Defans ve kalkan engellemez).</li><li><b>Yenilenme</b> (Büyücü pasifi): sıra Büyücüye her geri döndüğünde maksimum canının yaklaşık %${pc(RG)}'ini (±%15) iyileştirir.</li><li><b>Boşluk Darbesi</b>: ${COST.void} mana, kılıç hasarının %${pc(MULT.void)}'i gerçek hasar olarak.</li><li><b>Onarım</b> (sadece Juggernaut): ${COST.repair} mana, maksimum canın %25'ini iyileştirir. Eksik can gerekir.</li><li><b>Savaşçı skilleri</b> (sadece Savaşçı, bedava, her zaman hazır, alan hasarı yok): Güçlü Kesik %${pc(WS[0])}, Çapraz Kesik (2 vuruş) %${pc(WS[1])}, Kılıç Öfkesi (4 vuruş) %${pc(WS[2])} kılıç hasarı.</li><li><b>Bekleme süreleri</b>: her sınıf skili kullanıldıktan sonra 1 veya 2 tur beklemeye girer (düğmesinde BK olarak görünür). Tabanca 1 tur, bazuka 2 tur bekler. Temel silah vuruşunun beklemesi yoktur.</li><li>Hasar renkleri: turuncu sayılar fiziksel, mor sayılar büyü, turkuaz sayılar gerçek hasar, kırmızı sayılar kritik vuruştur.</li><li>Beceriler (Ark, Plazma, Nova, Ağır Kılıç) kılıcının hasarına dayanır; yani daha iyi bir kılıç onları güçlendirir.</li></ul>`)+

sec('Online ve kayıt',`<ul><li><b>Online 1v1</b>: Oda oluştur'a bas, modu (1v1, 2v2, 3v3) ve arkadaşının düşmanın mı takım arkadaşın mı olacağını seç, sonra linki gönder. Linki açınca ikiniz de sınıfınızı ve beceri puanlarınızı seçersiniz, sonra savaşırsınız. Kalan savaşçıları bilgisayar yönetir.</li><li><b>Lobi</b>: çevrimiçi diğer oyuncular lobide görünür. Birine dokunup modu ve tarafı seç, sonra daveti gönder.</li><li><b>XP ve seviye</b>: biten her maç XP verir: galibiyet yaklaşık 100, mağlubiyet 25 (her biri ±%10 değişir). Günlük sınır yok. İlk seviyeler hızlı gelir, sonrakiler giderek daha fazla maç ister; en yüksek seviye 100. Kaçmak XP vermez.</li><li>Odayı kuranın tarayıcısı tüm zarları ve sonuçları belirler ve diğer oyuncuya gönderir; ikiniz de aynı savaşı görürsünüz. Bu tam güvenli bir sunucu değildir.</li><li>Biri bağlantıyı kaybederse maç ödülsüz biter.</li><li>İlerlemeni her cihazda korumak için <b>giriş yap ya da kayıt ol</b>. Misafirken ilerleme sadece bu tarayıcıda saklanır.</li><li>Altın tarayıcın tarafından sayılır, yani henüz hileye karşı korunmuyor.</li></ul>`));}

function trNode(n){const v=n.nodeValue;if(n.__tr!==undefined&&v===n.__tr)return;if(LANG!='tr')return;const t=LT(v);if(t!==v){n.__en=v;n.__tr=t;n.nodeValue=t}}
function trAttrs(el){if(!el||el.nodeType!=1)return;for(const a of['title','placeholder']){if(!el.hasAttribute(a))continue;const v=el.getAttribute(a),st=el.__ta=el.__ta||{};if(st[a]&&st[a].tr===v)continue;if(LANG!='tr')continue;const t=LT(v);if(t!==v){st[a]={en:v,tr:t};el.setAttribute(a,t)}}}
function trWalk(root){if(!root)return;if(root.nodeType==3)return trNode(root);if(root.nodeType!=1)return;trAttrs(root);root.querySelectorAll&&root.querySelectorAll('[title],[placeholder]').forEach(trAttrs);const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=tw.nextNode())trNode(n)}
function trRestore(){const tw=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=tw.nextNode()){if(n.__tr!==undefined&&n.nodeValue===n.__tr){n.nodeValue=n.__en}n.__tr=undefined}document.querySelectorAll('[title],[placeholder]').forEach(el=>{const st=el.__ta;if(!st)return;for(const a in st){if(st[a]&&el.getAttribute(a)===st[a].tr)el.setAttribute(a,st[a].en);st[a]=null}})}
function setLang(l){LANG=l;try{localStorage.setItem('ed_lang',l)}catch(e){}document.documentElement.lang=l;if(l=='tr')trWalk(document.body);else trRestore();const b=$('#lang');if(b)b.textContent=l=='tr'?'EN':'TR';const h=document.querySelector('#ov .box h2');if(h&&/^(How to Play|Nasıl Oynanır)/.test(h.textContent))openHelp()}
new MutationObserver(ms=>{if(LANG!='tr')return;for(const m of ms){if(m.type=='characterData')trNode(m.target);else if(m.type=='attributes')trAttrs(m.target);else m.addedNodes.forEach(trWalk)}}).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['title','placeholder']});
{const _f=ctx.fillText.bind(ctx),_s=ctx.strokeText.bind(ctx);ctx.fillText=(t,...a)=>_f(LANG=='tr'?LT(t):t,...a);ctx.strokeText=(t,...a)=>_s(LANG=='tr'?LT(t):t,...a)}
