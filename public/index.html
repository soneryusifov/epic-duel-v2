(function(){

 ws.onclose=()=>{open=false;Object.values(RS).forEach(r=>r._conn(false));setTimeout(conn,1500)};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}if(m.t==='hi'){me=m.id;return}const r=RS[m.room];if(!r)return;if(m.t==='peers')r._peers(m.peers);else if(m.t==='msg')r._msg(m)}}
const tx=o=>{if(open)ws.send(JSON.stringify(o))};
function mk(name){const L={},P=[],C=[];let pr=[];
 const r={name,
  on(t,f){(L[t]=L[t]||[]).push(f);return()=>{L[t]=(L[t]||[]).filter(x=>x!==f)}},
  emit:async(t,d)=>{tx({t:'emit',room:name,topic:t,data:d})},
  presence:async p=>{tx({t:'pres',room:name,patch:p})},
  peers:()=>pr,
  onPeers(f){P.push(f);return()=>{const i=P.indexOf(f);if(i>=0)P.splice(i,1)}},
  connected:()=>open,
  onConnection(f){C.push(f);return()=>{const i=C.indexOf(f);if(i>=0)C.splice(i,1)}},
  leave:async()=>{tx({t:'leave',room:name});if(name!=='lobby')delete RS[name]},
  join:async n=>RS[n]||mk(n),
  _join(){tx({t:'join',room:name})},
  _conn(v){C.slice().forEach(f=>f(v))},
  _peers(l){const old=pr;pr=l.map(p=>({...p,isMe:p.peer===me,sameTab:p.peer===me,kind:'viewer',guest:false}));
   const joined=pr.filter(p=>!old.some(o=>o.peer===p.peer)),left=old.filter(o=>!pr.some(p=>p.peer===o.peer));
   P.slice().forEach(f=>f({peers:pr,joined,left,updated:[]}))},
  _msg(m){(L[m.topic]||[]).slice().forEach(f=>f({topic:m.topic,data:m.data,peer:m.peer,isMe:m.peer===me,sameTab:m.peer===me,kind:'viewer',guest:false}))}};
 RS[name]=r;if(open)r._join();return r}
const lobby=mk('lobby');
window.claude={use:async n=>n==='room'?lobby:null};
conn();
})();

sec('Actions',`<ul><li><b>Sword</b>: free melee hit, base 10 damage.</li><li><b>Heavy Sword</b>: ${COST.heavy} mana, melee, 2.2× the sword's damage.</li><li><b>Pistol</b>: free, base 17 damage. Usable every 2nd turn of yours; the first use is ready immediately. Only <b>5 shots</b> per match. The pistol rests in the hip holster; to fire it the fighter drops the main weapon and picks it up again afterwards.</li><li><b>Bazooka</b>: free, base 21 damage, usable every 3rd turn (first use ready immediately). Only <b>3 shots</b> per match. It is carried on the back. Also splashes nearby enemies.</li><li><b>Arc Bolt</b>: ${COST.arc} mana, ${pc(MULT.arc)}% of sword damage.</li><li><b>Plasma Burst</b>: ${COST.plasma} mana, ${pc(MULT.plasma)}% of sword damage.</li><li><b>Nova Strike</b>: ${COST.nova} mana. Two enemies alive: 110% to each. One enemy alive: 210% to it.</li><li><b>Lightning Storm</b> (Mage only): 60 mana, usable on your 2nd turn and then every 2nd turn. 3× your sword damage as magic damage, no walking up to the enemy: lightning strikes each enemy, with the same splash rule as the bazooka (50% / 25% by position).</li><li><b>Void Strike</b>: ${COST.void} mana, ${pc(MULT.void)}% of sword damage as true damage.</li><li><b>Repair</b> (Juggernaut only): ${COST.repair} mana, heals 25% of max health. Needs missing health.</li><li>Skills (Arc, Plasma, Nova, Heavy Sword) are based on your sword's damage, so a better sword makes them stronger.</li></ul>`)+
sec('How a hit is calculated',`<ol><li><b>Base</b> = weapon base × (1 + weapon tier bonus) × then × the skill multiplier.</li><li><b>Variation</b>: random ±10%.</li><li><b>Rage</b>: if the attacker is below 25% health, or on every 4th turn of that fighter, ×1.2 to ×1.5.</li><li><b>Critical</b>: 5% chance, ×2.0 to ×2.65.</li><li><b>Glancing hit</b> (ranged only): pistol 2.5% chance, bazooka about 1.7%. It still deals 25–50% of the damage and shows GLANCING.</li><li><b>Block</b> (sword and Heavy Sword only): 5% chance, the whole hit is stopped. Skills cannot be blocked or glance, but they can crit.</li><li><b>Defense</b> of the target: Physical Defense gives −2% physical damage per point and Magic Defense gives −2% magic damage per point, each capped at −50%.</li><li><b>Class armor</b>: a Tank takes 25% less physical and magic damage.</li><li><b>Shield</b> absorbs physical and magic damage first, then health drops. True damage skips shield, Defense and class armor.</li><li><b>Lifesteal</b>: the attacker heals its lifesteal share of the damage dealt (shield and health damage), up to max health. A dead fighter is never revived.</li></ol>`)+
sec('Bazooka splash and criticals',`<ul><li>The bazooka's explosion hurts the enemies standing next to the target, based on their position in the enemy line (top, middle, bottom).</li><li>Target in the middle: the enemy above and the enemy below each take 50% of the main damage.</li><li>Target at the top or bottom: the enemy next to it takes 50% and the one farthest away takes 25%.</li><li>With only two enemies, the other one takes 50%. Fallen enemies take no splash, but they still count for distance.</li><li>Splash uses the main target's resolved damage (after variation, Rage, crit and glancing) and then each victim's own defense and shield. Splash and Repair healing also vary by \u00B110% like every other hit.</li><li>The main hit has its own 5% crit chance, and each splash victim has a separate 5% crit chance.</li><li>If the main hit is a crit, every splash inherits that increase and does not roll again. Otherwise each splash can crit on its own (\u00D72.0 to \u00D72.65).</li></ul>`)+
sec('Classes',`<ul>${Object.values(CLS).map(c=>`<li style="color:${c.col}"><b>${c.n}</b>: ${c.d}</li>`).join('')}<li>Pick your class with the Class button in the lobby. Computer fighters get a random class.</li><li>Vampire lifesteal example: 50% base + 5 Lifesteal points (15%) = 65% of damage dealt comes back as health.</li></ul>`)+
sec('Damage types',`<ul><li><b>Physical</b> (Sword, Heavy Sword, Pistol, Bazooka and its splash): reduced by Physical Defense, soaked by Shield. White numbers.</li><li><b>Magic</b> (Arc Bolt, Plasma Burst, Nova Strike): reduced by Magic Defense, soaked by Shield. Violet numbers.</li><li><b>True</b> (Void Strike): ignores Shield, Defense and class armor, so it goes straight to health. Teal numbers.</li></ul>`)+
sec('Skill points and stats',`<p>You have 30 points to spend in Skills. You can reset and re-spend them any time in the lobby.</p><ul>${AL.map(([k,n,d])=>`<li><b>${n}</b>: ${d}</li>`).join('')}<li>Base health is 100 (Tank: 200), base mana is 100 (Mage: 140 max). You start each fight with 100 mana and regain about 10 mana (±10%) at the start of each of your turns, up to your max. Shield only exists at the start of a match and never regenerates.</li></ul>`)+
sec('Game modes and rewards',`<ul><li><b>1v1, 2v2, 3v3</b>: you plus computer teammates against the same number of computer opponents.</li><li><b>Juggernaut</b>: you alone, with your own points and the Repair skill, against two opponents who share a combined 45 skill points (50% more than the 30 of a full build).</li><li>A side wins when every fighter on the other side is down.</li><li>Level = 1 + wins ÷ 2.</li></ul><p>Gold per finished match, paid once:</p><ul>${rew}</ul><p>You start with 500 gold.</p>`)+
sec('Merchant and weapons',`<p>There are 10 tiers each of swords, pistols and bazookas. A purchased weapon is equipped automatically and changes how your fighter looks. You can switch equipped weapons for free.</p><p><b>Swords</b></p><ul>${tiers('sword')}</ul><p><b>Pistols</b></p><ul>${tiers('pistol')}</ul><p><b>Bazookas</b></p><ul>${tiers('bazooka')}</ul>`)+
sec('Online and saving',`<ul><li><b>Online 1v1</b>: press Create room, then send this page's link to a friend. They open it and press the Join button that appears.</li><li>The room creator's browser decides every roll and result and sends them to the other player, so both see the same fight. This is not a fully secure server.</li><li>If someone disconnects the match ends with no reward.</li><li><b>Log in or register</b> to keep your progress on any device. As a guest, progress is saved only in this browser.</li><li>Gold is counted by your browser, so it is not protected against cheating yet.</li></ul>`));}

const TRC=new Map();
function tr1(c){
 if(TRD[c]!==undefined)return TRD[c];
 for(const [re,f] of TRP){const m=re.exec(c);if(m)return f(...m)}
 let m=/^(.*?)((?: [★ⓘ])+)$/.exec(c);if(m){const a=tr1(m[1]);if(a!==m[1])return a+m[2]}
 if(c.includes(' · ')){return c.split(' · ').map(tr1).join(' · ')}
 const k=c.indexOf(': ');if(k>0){const a=tr1(c.slice(0,k)),b=tr1(c.slice(k+2));if(a!==c.slice(0,k)||b!==c.slice(k+2))return a+': '+b}
 return c}
function LT(s){if(LANG!='tr'||typeof s!='string'||!s)return s;const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(s);if(!m[2])return s;let r=TRC.get(m[2]);if(r===undefined){r=tr1(m[2]);if(TRC.size>3000)TRC.clear();TRC.set(m[2],r)}return m[1]+r+m[3]}

const CT={tank:'Tank',vampire:'Vampir',mage:'Büyücü',warrior:'Savaşçı'},CD={warrior:'Temel can 150. Kılıçla savaşan tek sınıf; kılıçları güçlendikçe uzar. Kılıç tabanlı tüm skiller (Kılıç, Ağır Kılıç ve enerji skilleri) %30 daha fazla hasar verir.',tank:'Temel can 200 (normalin iki katı). Her saldırısında %25 daha az hasar verir. Defans puanlarına ek olarak fiziksel ve büyü hasarını %25 az alır. Gerçek hasar bunu yok sayar. Skiller: Gürz, Gürz Darbesi (20 mana, 1,5 kat hasar), Çift Darbe (30 mana, aşağı ve yukarı iki vuruş, toplam 2,5 kat hasar, her biri ±%15), Diriltme (50 mana: düşen bir takım arkadaşını %20 canla geri getirir), ayrıca Tabanca ve Bazuka.',vampire:'Hançerle savaşır. Yakın hasar skillerinde verdiği hasarın %50\'si kadar can çalar. Skiller: Hançer, Ağır Hançer (%25 fazla hasar, 20 mana), Can Çalma (30 mana: üç vuruş - yukarıdan aşağı, aşağıdan yukarı, yatay - toplam hançerin 3,5 katı hasar, her biri ±%15, iki kat can çalar), Can Potu (yaklaşık 50 can verir (±%10), 40 mana), ayrıca Tabanca ve Bazuka. Can çalma puanları bunun üstüne puan başına %3 ekler. İyileşme asla maksimum canı aşmaz.',mage:'Asayla savaşır. Büyü becerileri %60 daha fazla hasar verir. Skiller: Asa Darbesi (20 mana, 1,5 kat hasar), Büyü Küresi (30 mana, 2,5 kat hasar) ve Şimşek Fırtınası (60 mana, her düşmana 3 kat hasar), ayrıca Tabanca ve Bazuka. Maksimum mana +40 (savaşa yine 100 manayla başlarsın).'};

modal(`<h2>Nasıl Oynanır</h2>`+
sec('Sıra ve kontroller',`<ul><li>Sıra iki taraf arasında dönüşümlü ilerler, her seferinde bir savaşçı oynar. ▼ ile işaretli isim sırası gelen savaşçıdır. 1v1'de sen ve rakip sırayla oynarsınız.</li><li>Sıran gelince bir aksiyon seç, sonra bir düşmana dokun. Tek düşman hayattaysa saldırı otomatik ona gider. Nova Darbesi ve Onarım hedef istemez.</li><li>Sıran değilken aksiyon butonları sönükleşir ve basılamaz. Gri buton, yetersiz mana ya da bekleme süresi demektir.</li><li>Her butondaki sayı, mevcut değerlerinle ortalama hasardır (ya da iyileşme). Altında mana bedeli ya da BK ile kalan bekleme turu görünür.</li><li>Üst çubuk: adın profilini açar, ⇄ görünümü değiştirir (otomatik / yatay / dikey), ♪ sesi kapatır, ? bu rehberi açar, TR/EN dili değiştirir, ⚑ Kaç savaştan çıkar.</li><li>Bir savaşçının üstüne basınca (ya da fareyle üstüne gelince) tüm build'i görürsün.</li></ul>`,1)+
sec('Aksiyonlar',`<ul><li><b>Kılıç</b>: bedava yakın dövüş vuruşu, temel hasar 10.</li><li><b>Ağır Kılıç</b>: ${COST.heavy} mana, yakın dövüş, kılıç hasarının 2,2 katı.</li><li><b>Tabanca</b>: bedava, temel hasar 17. Senin her 2. turunda kullanılır; ilk kullanım hemen hazırdır. Maç başına sadece <b>5 mermi</b>. Tabanca kalçadaki kılıftadır; ateşlemek için savaşçı asıl silahını yere bırakır ve sonra tekrar alır.</li><li><b>Bazuka</b>: bedava, temel hasar 21, her 3. turda kullanılır (ilk kullanım hemen hazır). Maç başına sadece <b>3 mermi</b>. Sırtta taşınır. Yakındaki düşmanlara da sıçrama hasarı verir.</li><li><b>Ark Şimşeği</b>: ${COST.arc} mana, kılıç hasarının %${pc(MULT.arc)}'i.</li><li><b>Plazma Patlaması</b>: ${COST.plasma} mana, kılıç hasarının %${pc(MULT.plasma)}'i.</li><li><b>Nova Darbesi</b>: ${COST.nova} mana. İki düşman hayattaysa her birine %110. Tek düşman kaldıysa ona %210.</li><li><b>Şimşek Fırtınası</b> (sadece Büyücü): 60 mana, 2. turunda ve sonra her 2. turda kullanılır. Kılıç hasarının 3 katı büyü hasarı; düşmana yürümez, şimşekler her düşmanın üstüne düşer. Sıçrama kuralı bazukayla aynıdır (konuma göre %50 / %25).</li><li><b>Boşluk Darbesi</b>: ${COST.void} mana, kılıç hasarının %${pc(MULT.void)}'i gerçek hasar olarak.</li><li><b>Onarım</b> (sadece Juggernaut): ${COST.repair} mana, maksimum canın %25'ini iyileştirir. Eksik can gerekir.</li><li>Beceriler (Ark, Plazma, Nova, Ağır Kılıç) kılıcının hasarına dayanır; yani daha iyi bir kılıç onları güçlendirir.</li></ul>`)+
sec('Bir vuruş nasıl hesaplanır',`<ol><li><b>Temel</b> = silah temeli × (1 + silah kademe bonusu), sonra × beceri çarpanı.</li><li><b>Sapma</b>: rastgele ±%10. Sıçrama hasarı ve Onarım iyileşmesi de aynı sapmayı kullanır.</li><li><b>Öfke</b>: saldıranın canı %25'in altındaysa ya da o savaşçının her 4. turunda ×1,2 ile ×1,5.</li><li><b>Kritik</b>: %5 şans, ×2,0 ile ×2,65.</li><li><b>Sıyırma</b> (sadece uzak mesafe): tabanca %2,5, bazuka yaklaşık %1,7 şans. Hasarın %25–50'sini yine verir ve SIYIRMA yazar.</li><li><b>Blok</b> (sadece kılıç ve Ağır Kılıç): %5 şans, vuruşun tamamı durdurulur. Beceriler bloklanamaz ve sıyırmaz ama kritik olabilir.</li><li>Hedefin <b>Defans</b>ı: Fiziksel Defans puan başına −%2 fiziksel hasar, Büyü Defansı puan başına −%2 büyü hasarı azaltır; ikisi de en fazla −%50.</li><li><b>Sınıf zırhı</b>: Tank fiziksel ve büyü hasarını %25 az alır.</li><li><b>Kalkan</b> önce fiziksel ve büyü hasarını emer, sonra can düşer. Gerçek hasar kalkanı, Defans'ı ve sınıf zırhını atlar.</li><li><b>Can çalma</b>: saldıran, verdiği hasarın (kalkan ve can hasarı) can çalma oranı kadarını iyileşir; maksimum canı aşamaz. Ölen savaşçı asla dirilmez.</li></ol>`)+
sec('Bazuka sıçraması ve kritikler',`<ul><li>Bazuka patlaması, hedefin yanında duran düşmanlara, düşman hattındaki konumlarına göre (üst, orta, alt) hasar verir.</li><li>Hedef ortadaysa: üstteki ve alttaki düşman ana hasarın %50'sini yer.</li><li>Hedef üstte ya da altta ise: yanındaki düşman %50, en uzaktaki %25 yer.</li><li>Sadece iki düşman varsa diğeri %50 yer. Düşmüş düşman sıçrama yemez ama mesafe hesabında sayılır.</li><li>Sıçrama, ana hedefin hesaplanmış hasarını (sapma, Öfke, kritik ve sıyırma sonrası) kullanır; sonra her kurbanın kendi Defans ve Kalkanı uygulanır.</li><li>Ana vuruşun kendi %5 kritik şansı, her sıçrama kurbanının da ayrı %5 kritik şansı vardır.</li><li>Ana vuruş kritikse tüm sıçramalar bu artışı miras alır ve tekrar zar atmaz. Değilse her sıçrama kendi başına kritik olabilir (×2,0 ile ×2,65).</li></ul>`)+
sec('Sınıflar',`<ul>${Object.entries(CLS).map(([k,c])=>`<li style="color:${c.col}"><b>${CT[k]}</b>: ${CD[k]}</li>`).join('')}<li>Sınıfını lobideki Sınıf butonundan ya da maç başında seçersin. Bilgisayar savaşçıları rastgele sınıf alır ve isimleri yerine sınıfları yazar.</li><li>Vampir örneği: %50 temel + 5 Can Çalma puanı (%15) = verilen hasarın %65'i can olarak geri döner.</li></ul>`)+
sec('Hasar türleri',`<ul><li><b>Fiziksel</b> (Kılıç, Ağır Kılıç, Tabanca, Bazuka ve sıçraması): Fiziksel Defans ile azalır, Kalkan emer. Beyaz sayılar.</li><li><b>Büyü</b> (Ark Şimşeği, Plazma Patlaması, Nova Darbesi): Büyü Defansı ile azalır, Kalkan emer. Mor sayılar.</li><li><b>Gerçek</b> (Boşluk Darbesi): Kalkanı, Defans'ı ve sınıf zırhını yok sayar, direkt cana gider. Turkuaz sayılar.</li></ul>`)+
sec('Beceri puanları ve değerler',`<p>Becerilere harcamak için 30 puanın var. Lobide istediğin zaman sıfırlayıp yeniden dağıtabilirsin.</p><ul>${Object.keys(AT).map(k=>`<li><b>${AT[k][0]}</b>: ${AT[k][1]}</li>`).join('')}<li>Temel can 100 (Tank: 200), temel mana 100 (Büyücü: maks. 140). Her savaşa 100 manayla başlarsın ve her turunun başında yaklaşık 10 mana (±%10) kazanırsın (maksimuma kadar). Kalkan sadece maçın başında vardır ve yenilenmez.</li></ul>`)+
sec('Oyun modları ve ödüller',`<ul><li><b>1v1, 2v2, 3v3</b>: sen ve bilgisayar takım arkadaşların, aynı sayıda bilgisayar rakibe karşı.</li><li><b>Juggernaut</b>: tek başına, kendi puanların ve Onarım becerinle, toplam 45 beceri puanını paylaşan iki rakibe karşı (tam bir build'in 30 puanından %50 fazla).</li><li>Karşı tarafın tüm savaşçıları yere düşünce o taraf kazanır.</li><li>Seviye = 1 + galibiyet ÷ 2.</li></ul><p>Biten maç başına altın (bir kez ödenir):</p><ul>${rew}</ul><p>500 altınla başlarsın.</p>`)+
sec('Tüccar ve silahlar',`<p>Kılıç, tabanca ve bazukanın her birinden 10 kademe vardır. Satın alınan silah otomatik kuşanılır ve savaşçının görünümünü değiştirir. Kuşanılan silahları ücretsiz değiştirebilirsin.</p><p><b>Kılıçlar</b></p><ul>${tiers('sword')}</ul><p><b>Tabancalar</b></p><ul>${tiers('pistol')}</ul><p><b>Bazukalar</b></p><ul>${tiers('bazooka')}</ul>`)+
sec('Online ve kayıt',`<ul><li><b>Online 1v1</b>: Oda oluştur'a bas, sonra bu sayfanın linkini arkadaşına gönder. Linki açınca çıkan Katıl butonuna basar.</li><li>Odayı kuranın tarayıcısı tüm zarları ve sonuçları belirler ve diğer oyuncuya gönderir; ikiniz de aynı savaşı görürsünüz. Bu tam güvenli bir sunucu değildir.</li><li>Biri bağlantıyı kaybederse maç ödülsüz biter.</li><li>İlerlemeni her cihazda korumak için <b>giriş yap ya da kayıt ol</b>. Misafirken ilerleme sadece bu tarayıcıda saklanır.</li><li>Altın tarayıcın tarafından sayılır, yani henüz hileye karşı korunmuyor.</li></ul>`));}

function trNode(n){const v=n.nodeValue;if(n.__tr!==undefined&&v===n.__tr)return;if(LANG!='tr')return;const t=LT(v);if(t!==v){n.__en=v;n.__tr=t;n.nodeValue=t}}
function trAttrs(el){if(!el||el.nodeType!=1)return;for(const a of['title','placeholder']){if(!el.hasAttribute(a))continue;const v=el.getAttribute(a),st=el.__ta=el.__ta||{};if(st[a]&&st[a].tr===v)continue;if(LANG!='tr')continue;const t=LT(v);if(t!==v){st[a]={en:v,tr:t};el.setAttribute(a,t)}}}
function trWalk(root){if(!root)return;if(root.nodeType==3)return trNode(root);if(root.nodeType!=1)return;trAttrs(root);root.querySelectorAll&&root.querySelectorAll('[title],[placeholder]').forEach(trAttrs);const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=tw.nextNode())trNode(n)}
function trRestore(){const tw=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=tw.nextNode()){if(n.__tr!==undefined&&n.nodeValue===n.__tr){n.nodeValue=n.__en}n.__tr=undefined}document.querySelectorAll('[title],[placeholder]').forEach(el=>{const st=el.__ta;if(!st)return;for(const a in st){if(st[a]&&el.getAttribute(a)===st[a].tr)el.setAttribute(a,st[a].en);st[a]=null}})}
function setLang(l){LANG=l;try{localStorage.setItem('ed_lang',l)}catch(e){}document.documentElement.lang=l;if(l=='tr')trWalk(document.body);else trRestore();const b=$('#lang');if(b)b.textContent=l=='tr'?'EN':'TR';const h=document.querySelector('#ov .box h2');if(h&&/^(How to Play|Nasıl Oynanır)/.test(h.textContent))openHelp()}
new MutationObserver(ms=>{if(LANG!='tr')return;for(const m of ms){if(m.type=='characterData')trNode(m.target);else if(m.type=='attributes')trAttrs(m.target);else m.addedNodes.forEach(trWalk)}}).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['title','placeholder']});
